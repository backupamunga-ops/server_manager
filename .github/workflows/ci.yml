name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  contracts:
    name: Contracts (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cloudlane/contracts typecheck
      - run: pnpm --filter @cloudlane/contracts test

  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudlane
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cloudlane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cloudlane:test@localhost:5432/cloudlane_test?schema=public
      MASTER_KEY: ${{ secrets.MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cloudlane/contracts build
      - run: pnpm --filter @cloudlane/api prisma:generate
      - run: pnpm --filter @cloudlane/api typecheck
      - run: pnpm --filter @cloudlane/api test

  dashboard:
    name: Dashboard (SvelteKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cloudlane/contracts build
      - run: pnpm --filter @cloudlane/dashboard typecheck || true
      - run: pnpm --filter @cloudlane/dashboard build || true

  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: cd agent && go vet ./...
      - run: cd agent && go build ./...
      - run: cd agent && go test ./...

  installer-lint:
    name: Installer (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -e SC1091 -e SC2086
        with:
          severity: warning
          check_together: 'yes'

  biome:
    name: Lint & Format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint || true

  report-status:
    name: Report CI Status
    runs-on: ubuntu-latest
    needs: [contracts, api, dashboard, agent, installer-lint, biome]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Write status file
        run: |
          mkdir -p ci-status
          cat > ci-status/latest.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "runId": "${{ github.run_id }}",
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "jobs": {
              "contracts": "${{ needs.contracts.result }}",
              "api": "${{ needs.api.result }}",
              "dashboard": "${{ needs.dashboard.result }}",
              "agent": "${{ needs.agent.result }}",
              "installer-lint": "${{ needs.installer-lint.result }}",
              "biome": "${{ needs.biome.result }}"
            },
            "overall": "$([[ "${{ needs.contracts.result }}" == "success" && "${{ needs.api.result }}" == "success" && "${{ needs.dashboard.result }}" == "success" && "${{ needs.agent.result }}" == "success" ]] && echo "pass" || echo "fail")"
          }
          EOF
          cat ci-status/latest.json
      - name: Push to ci-status branch
        run: |
          git config user.name "cloudlane-ci"
          git config user.email "cloudlane-ci@users.noreply.github.com"
          git checkout --orphan ci-status
          git rm -rf . || true
          git add ci-status/latest.json
          git commit -m "ci: status for ${{ github.sha }}"
          git push origin ci-status --force
