-- Cloudlane PostgreSQL tuning for 1GB VPS
-- Applied on first initialization via docker-entrypoint-initdb.d

ALTER SYSTEM SET shared_buffers = '32MB';
ALTER SYSTEM SET max_connections = 20;
ALTER SYSTEM SET work_mem = '2MB';
ALTER SYSTEM SET maintenance_work_mem = '16MB';
ALTER SYSTEM SET effective_cache_size = '256MB';
ALTER SYSTEM SET wal_buffers = '1MB';
ALTER SYSTEM SET checkpoint_completion_target = 0.9;
ALTER SYSTEM SET random_page_cost = 1.1;
ALTER SYSTEM SET log_min_duration_statement = 1000;
ALTER SYSTEM SET timezone = 'UTC';

SELECT pg_reload_conf();
